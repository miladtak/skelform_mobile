name: ساخت خودکار نسخه اندروید (APK)

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: دریافت کد
        uses: actions/checkout@v4

      - name: نصب Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: نصب وابستگی‌ها
        run: npm install

      - name: ساخت پوشه www و کپی فایل‌ها
        run: |
          mkdir -p www
          cp index.html SkelForm.js SkelForm_bg.wasm anim_icons.png www/ 2>/dev/null || true
          echo "پوشه www با موفقیت ساخته شد."

      - name: افزودن پلتفرم اندروید
        run: npx cap add android

      - name: همگام‌سازی فایل‌های اندروید
        run: npx cap sync android

      - name: ساخت فایل APK با Gradle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: بارگذاری فایل APK
        uses: actions/upload-artifact@v4
        with:
          name: برنامه-اندروید
          path: android/app/build/outputs/apk/debug/app-debug.apk
